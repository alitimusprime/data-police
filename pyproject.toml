[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "data-police"
version = "0.1.0"
description = "Evidence-first data reliability and incident investigation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2", "polars>=1.20,<2", "duckdb>=1.2,<2",
  "scipy>=1.15,<2", "httpx>=0.28,<1", "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4", "celery[redis]>=5.5,<6", "python-dotenv>=1,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pytest-cov>=6,<8"]
orchestration = ["dagster>=1.10,<2", "dagster-webserver>=1.10,<2", "dagster-postgres>=0.26,<1"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
