name: Data Police CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: dp_test
          POSTGRES_PASSWORD: ci-only-test-password
          POSTGRES_DB: datapolice_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U dp_test -d datapolice_test" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.lock
      - run: ruff check backend tests scripts migrations
      - run: python scripts/secret_audit.py
      - name: Test the local profile
        run: pytest -q
      - name: Test native PostgreSQL persistence and connectors
        env:
          DP_TEST_DATABASE_URL: postgresql+psycopg://dp_test:ci-only-test-password@localhost:5432/datapolice_test
          DP_TEST_SOURCE_DATABASE_URL: postgresql+psycopg://dp_test:ci-only-test-password@localhost:5432/datapolice_test
          DP_TEST_REDIS_URL: redis://localhost:6379/0
        run: pytest -q
      - name: Verify migration from an empty database
        env:
          DP_DATABASE_URL: sqlite:///migration-check.db
        run: |
          alembic upgrade head
          alembic check
  frontend-and-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.lock
      - run: npm ci
        working-directory: web
      - run: npm run test
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: DP_QA_PYTHON=python node scripts/browser_qa.mjs
      - run: python scripts/smoke_local.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: browser-acceptance, path: artifacts/browser}
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/bootstrap.py --quiet
      - run: docker compose config --quiet
      - run: docker build -t data-police:ci .
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pip-audit
      - run: pip-audit -r requirements.lock
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web
